name: CI

on:
  push:
    branches: [main]
    paths:
      - "packages/drizzle-migrator/**"
      - "packages/drizzle-migrator-cli/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "packages/drizzle-migrator/**"
      - "packages/drizzle-migrator-cli/**"
      - ".github/workflows/ci.yml"

jobs:
  lib:
    name: lib (node ${{ matrix.node }}, drizzle-orm ${{ matrix.drizzle-orm || 'lockfile' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        drizzle-orm: ["", "0.36.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Pin lowest supported drizzle-orm (peer-range matrix)
        if: matrix.drizzle-orm != ''
        run: pnpm --filter @dugstack/drizzle-migrator add drizzle-orm@${{ matrix.drizzle-orm }}

      - name: Build
        run: pnpm -r build

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test
