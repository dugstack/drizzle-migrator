# RELEASE PIPELINE — GATED OFF. Nothing here publishes anything while `if: false` is set.
#
# This is the intended changesets + provenance flow per plan §3 / §11 (Milestone 6). Enable it
# ONLY after all of the following exist:
#
#   1. The real npm scope replaces the @yourorg placeholder everywhere (plan header).
#   2. An NPM_TOKEN repository secret (automation token with publish rights for the scope).
#   3. The changesets "Version Packages" PR flow (changesets/action, wired below).
#   4. For the 0.1.0 alpha specifically: add `--tag alpha` to the publish command (or publish
#      the tagged version manually) so the alpha does not become `latest`.
#
# Publishing rules from the plan: versioning via changesets at the repo root; `npm publish
# --access public --provenance` runs from packages/drizzle-migrator ONLY.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm --filter @yourorg/drizzle-migrator publish --access public --provenance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
