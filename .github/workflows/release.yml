# RELEASE PIPELINE — publishes alpha releases through changesets and npm OIDC.
# GitHub supplies a short-lived identity token; npm verifies it against each
# package's Trusted Publisher configuration. No npm token belongs in this workflow.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # npm OIDC support starts at npm 11.5.1; Node 22 alone may ship an older npm.
      - name: Install OIDC-capable npm
        run: npm install --global npm@^11.5.1

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm -r --filter @dugstack/drizzle-migrator --filter @dugstack/drizzle-migrator-cli exec npm publish --access public --provenance --tag alpha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
