# RELEASE PIPELINE — stages alpha releases through changesets and npm OIDC.
# GitHub supplies a short-lived identity token; npm verifies it against each
# package's Trusted Publisher configuration. A maintainer approves each stage.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Staged publishing requires npm 11.15.0; Node 22 alone may ship an older npm.
      - name: Install OIDC-capable npm
        run: npm install --global npm@^11.15.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # A prior run may have staged or published only one package. Skip versions
      # already on npm so retrying stages only the remaining package.
      - name: Version or stage unpublished packages
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: bash .github/scripts/stage-unpublished-packages.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
