# RELEASE PIPELINE — publishes alpha releases through changesets and npm provenance.
# The initial 0.1.0 alpha uses workflow_dispatch because no changeset exists before first publish.
#
# Publishing rules from the plan: versioning via changesets at the repo root; `pnpm -r publish
# --access public --provenance` publishes both @dugstack packages (private workspaces are
# skipped automatically).

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publishInitialAlpha:
        description: "Publish current package versions under npm dist-tag alpha"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Version or publish
        if: github.event_name != 'workflow_dispatch' || !inputs.publishInitialAlpha
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm -r publish --access public --provenance --tag alpha
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish initial alpha
        if: github.event_name == 'workflow_dispatch' && inputs.publishInitialAlpha
        run: pnpm -r publish --access public --provenance --tag alpha
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
